# GPT-2-small-sized model (~124M parameters at a 50k vocab). Needs a GPU.
model:
  block_size: 1024
  n_layer: 12
  n_head: 12
  n_embd: 768
  dropout: 0.0

data:
  dir: data/base

train:
  out_dir: runs/base
  batch_size: 12
  grad_accum_steps: 40  # effective batch of 480 sequences
  max_steps: 600000
  learning_rate: 6e-4
  min_lr: 6e-5
  warmup_steps: 2000
  weight_decay: 0.1
  eval_interval: 2000
  eval_iters: 200
  log_interval: 10
  compile: true
