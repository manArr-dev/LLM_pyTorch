# ~1M-parameter model (at a 2k vocab). Trains on a laptop CPU in about 15-20 minutes.
model:
  block_size: 128
  n_layer: 4
  n_head: 4
  n_embd: 128
  dropout: 0.1

data:
  dir: data/tiny

train:
  out_dir: runs/tiny
  batch_size: 32
  max_steps: 2000
  learning_rate: 1e-3
  min_lr: 1e-4
  warmup_steps: 100
  eval_interval: 250
  eval_iters: 20
  log_interval: 25
