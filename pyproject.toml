[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm"
version = "0.1.0"
description = "A decoder-only transformer language model: BPE tokenizer, GPT model, training loop, sampling."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
llm-prepare = "llm.prepare:main"
llm-train = "llm.train:main"
llm-generate = "llm.generate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
